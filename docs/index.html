<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theorem House – Online math tutoring</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>θ</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;500;700&display=swap">
<style>
:root{--paper:#eef3f0;--grid:#d3e0d9;--ink:#14213d;--mute:#5b6b7a;--chalk:#ffc93c;--green:#1f7a5c;--red:#c2410c;--card:#fffefa;--line:#c5d3cc;--r:14px;color-scheme:light}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:16px/1.55 Figtree,system-ui,sans-serif;color:var(--ink);background:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
h1,h2,h3{font-family:'Bricolage Grotesque',Figtree,sans-serif;line-height:1.1;margin:0}
h1{font-size:clamp(2.4rem,6vw,4.4rem);font-weight:800;letter-spacing:-.03em}
h2{font-size:clamp(1.6rem,3vw,2.2rem);font-weight:800;letter-spacing:-.02em}
h3{font-size:1.15rem;font-weight:800}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--green);outline-offset:2px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1.5px solid var(--ink)}
header .wrap{display:flex;align-items:center;gap:14px;height:62px}
.logo{display:flex;align-items:center;gap:10px;font:800 1.2rem 'Bricolage Grotesque';background:none;border:0;padding:0}
.logo i{display:grid;place-items:center;width:34px;height:34px;background:var(--ink);color:var(--chalk);border-radius:9px;font-style:normal;font-size:1.3rem}
.sp{flex:1}
.btn{border:1.5px solid var(--ink);background:var(--card);padding:9px 16px;border-radius:999px;font-weight:700;transition:transform .12s,box-shadow .12s;box-shadow:0 2px 0 var(--ink)}
.btn:hover{transform:translateY(-1px);box-shadow:0 3px 0 var(--ink)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.pri{background:var(--chalk)}
.btn.ghost{box-shadow:none;border-color:var(--line)}
.btn.danger{color:var(--red);border-color:var(--red);box-shadow:none}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn.sm{padding:5px 12px;font-size:.9rem}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:40px;padding:56px 0 40px;align-items:center}
.hero p.lead{font-size:1.15rem;max-width:46ch;color:var(--mute)}
.ctas{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0 10px}
.demo{font-size:.9rem;color:var(--mute)}
.demo button{border:0;background:none;text-decoration:underline;padding:0 4px;font-weight:700;color:var(--green)}
.board{background:var(--card);border:1.5px solid var(--ink);border-radius:20px;padding:22px;box-shadow:6px 6px 0 var(--ink)}
.board label{font-weight:700;display:block;margin-bottom:6px}
.prices{display:flex;gap:12px;margin:10px 0 14px}
.price{flex:1;border:1.5px solid var(--line);border-radius:var(--r);padding:12px 14px}
.price b{display:block;font:800 2.3rem/1 'Bricolage Grotesque';font-variant-numeric:tabular-nums}
.price s{color:var(--mute);margin-left:6px;font-size:.95rem}
.price span{font-size:.9rem;color:var(--mute)}
input[type=range]{width:100%;accent-color:var(--ink)}
.stair{width:100%;height:auto;display:block;margin-top:6px}
section.blk{padding:44px 0}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.pill{border:1.5px solid var(--ink);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:700;transition:background .12s}
.pill[aria-pressed=true],.pill.on{background:var(--ink);color:var(--paper)}
.panel{background:var(--card);border:1.5px solid var(--ink);border-radius:var(--r);padding:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{border:1.5px solid var(--line);border-radius:10px;padding:5px 11px;background:var(--paper);font-size:.95rem}
.tabs{display:flex;gap:6px;border-bottom:1.5px solid var(--ink);margin:26px 0 22px;overflow-x:auto}
.tab{border:1.5px solid transparent;border-bottom:0;background:none;padding:9px 18px;font-weight:700;border-radius:10px 10px 0 0;white-space:nowrap}
.tab[aria-selected=true]{background:var(--card);border-color:var(--ink);margin-bottom:-1.5px}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:9px 18px;font-weight:700}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:14px}
.card{background:var(--card);border:1.5px solid var(--ink);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.card .meta{color:var(--mute);font-size:.92rem}
.card .go{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
.dots{display:flex;gap:4px}
.dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ink)}
.dots i.f{background:var(--green);border-color:var(--green)}
.dots i.n{border-style:dashed}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.82rem;font-weight:700;border:1.5px solid var(--ink)}
.badge.CONFIRMED{background:#c9ecdd}.badge.PENDING{background:var(--chalk)}.badge.CANCELLED{background:#ddd;border-color:#aaa;color:#666}
.bar{height:14px;border-radius:99px;border:1.5px solid var(--ink);background:var(--card);overflow:hidden}
.bar i{display:block;height:100%;background:var(--chalk);transition:width .5s}
.empty{border:2px dashed var(--line);border-radius:var(--r);padding:30px;text-align:center;color:var(--mute)}
.week{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.day{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:10px;min-height:150px;display:flex;flex-direction:column;gap:8px}
.day h3{font-size:1rem}
.slot{text-align:left;border:1.5px solid var(--ink);background:var(--paper);border-radius:10px;padding:7px 9px;font-size:.88rem;line-height:1.3}
.slot.G{background:#d8ecff}.slot.S{background:#fff2c4}
.add{border:1.5px dashed var(--line);background:none;border-radius:10px;padding:6px;color:var(--mute);margin-top:auto}
.add:hover{border-color:var(--ink);color:var(--ink)}
dialog{border:1.5px solid var(--ink);border-radius:20px;padding:24px;width:min(460px,calc(100% - 24px));background:var(--card);color:var(--ink);box-shadow:6px 6px 0 var(--ink)}
dialog::backdrop{background:rgba(20,33,61,.45)}
form.f{display:grid;gap:14px}
.fld label{display:block;font-weight:700;font-size:.92rem;margin-bottom:4px}
.fld input,.fld select{width:100%;font:inherit;padding:10px 12px;border:1.5px solid var(--ink);border-radius:10px;background:#fff}
.fld input[aria-invalid=true]{border-color:var(--red)}
.hint{font-size:.85rem;color:var(--mute);min-height:1.2em}
.hint.err{color:var(--red)}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:grid;gap:8px;z-index:20;width:min(420px,calc(100% - 24px))}
.toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;animation:up .25s;border-left:6px solid var(--chalk)}
.toast.err{border-left-color:#ff8a5c}
@keyframes up{from{transform:translateY(12px);opacity:0}}
.skel{height:110px;border-radius:var(--r);background:linear-gradient(90deg,#e4ece8,#f4f8f6,#e4ece8);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
footer{border-top:1.5px solid var(--ink);padding:24px 0;color:var(--mute);font-size:.92rem;margin-top:30px}
@media(max-width:820px){.hero{grid-template-columns:1fr;padding-top:34px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <button class="logo" data-act="home" aria-label="Theorem House home"><i>θ</i>Theorem House</button>
  <span class="sp"></span>
  <nav id="nav" class="row" style="gap:8px"></nav>
</div></header>
<main id="main" class="wrap" tabindex="-1"></main>
<footer><div class="wrap">Theorem House runs on the Java booking rules you wrote. Prices and discounts shown here come straight from the server.</div></footer>
<dialog id="dlg"></dialog>
<div id="toasts" role="status" aria-live="polite"></div>

<script>
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>'$'+Number(n).toFixed(2);
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const S={info:null,me:null,tab:null,type:'SOLO',unit:null,months:7,grade:5};

const API_BASE_URL = 'https://theorem-house-production.up.railway.app';

async function api(p, b) {
    const r = await fetch(`${API_BASE_URL}/api/${p}`, b ? {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(b)
    } : {});

    const d = await r.json().catch(() => ({
        error: 'The server did not answer. Is it running?'
    }));

    if (!r.ok) {
        throw new Error(d.error || 'Something went wrong.');
    }

    return d;
}
function toast(msg,err){const t=document.createElement('div');t.className='toast'+(err?' err':'');t.textContent=msg;$('#toasts').append(t);setTimeout(()=>t.remove(),4200)}
const fail=e=>toast(e.message,true);

/* ---------- dialog helper: html in, resolves with true on confirm ---------- */
function dialog(html,{onOpen}={}){
  const d=$('#dlg');d.innerHTML=html;
  return new Promise(res=>{
    d.onclose=()=>res(d.returnValue==='ok');
    d.returnValue='';d.showModal();onOpen&&onOpen(d);
    d.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>d.close(b.dataset.close));
  });
}
const confirmBox=(title,text,okLabel,danger)=>dialog(`<h2>${esc(title)}</h2><p>${text}</p><div class="acts"><button class="btn ghost" data-close="no">Keep it</button><button class="btn ${danger?'danger':'pri'}" data-close="ok">${esc(okLabel)}</button></div>`);

/* ---------- loyalty helpers (mirror Student.LOYALTY_TIERS from the server) ---------- */
const discAt=m=>S.info.tiers.reduce((p,t)=>m>=t.months?t.percent:p,0);
const priceAt=(base,m)=>(Math.round(base*(100-discAt(m)))/100);

/* ---------- views ---------- */
function nav(){
  const n=$('#nav');
  n.innerHTML=S.me?`<span class="demo" style="margin-right:6px">${esc(S.me.name)} · ${S.me.role}</span><button class="btn sm" data-act="logout">Log out</button>`
    :`<button class="btn sm ghost" data-act="learn">Curriculum</button><button class="btn sm" data-act="auth" data-mode="login">Log in</button>`;
}
function render(){nav();S.me?(S.me.role==='student'?studentView():tutorView()):homeView();window.scrollTo({top:0})}

function homeView(){
  const i=S.info;
  $('#main').innerHTML=`
  <section class="hero">
    <div>
      <h1>The longer you learn here, the less each hour costs.</h1>
      <p class="lead" style="margin-top:18px">Online math tutoring for Grades 1–10. Book one-to-one or join a small class, and your loyalty discount grows every month you stay.</p>
      <div class="ctas">
        <button class="btn pri" data-act="auth" data-role="student" data-mode="register">I’m a student</button>
        <button class="btn" data-act="auth" data-role="tutor" data-mode="register">I’m a tutor</button>
      </div>
      <p class="demo">Just looking? Try the demo as <button data-act="demo" data-id="DEMO">a student</button> or <button data-act="demo" data-id="AMARA">a tutor</button>.</p>
    </div>
    <div class="board">
      <label for="mo">Drag to see your price after <b id="moN"></b></label>
      <input id="mo" type="range" min="0" max="18" value="${S.months}">
      <div class="prices" id="pr"></div>
      <svg id="st" class="stair" viewBox="0 0 360 110" role="img" aria-label="Loyalty discount by account age"></svg>
    </div>
  </section>
  <section class="blk" id="learn">
    <h2>What we teach</h2>
    <p class="demo">Pick a grade to see its units.</p>
    <div class="pills" id="gp">${i.grades.map(g=>`<button class="pill" data-g="${g.grade}" aria-pressed="${g.grade===S.grade}">Grade ${g.grade}</button>`).join('')}</div>
    <div class="panel" id="gd"></div>
  </section>
  <section class="blk">
    <h2>How classes work</h2>
    <div class="grid">
      <div class="card"><h3>Solo · ${money(i.solo)}</h3><span>One student, one tutor. Confirmed the moment you book.</span></div>
      <div class="card"><h3>Group · ${money(i.group)}</h3><span>${i.groupMin} to ${i.groupMax} students. It runs once ${i.groupMin} have joined, and you’re charged only then.</span></div>
      <div class="card"><h3>Loyalty</h3><span>${i.tiers.map(t=>`${t.months}+ months: ${t.percent}% off`).join('. ')}.</span></div>
    </div>
  </section>`;
  const draw=()=>{
    const m=S.months,d=discAt(m);
    $('#moN').textContent=m+(m===1?' month':' months');
    $('#pr').innerHTML=[['Solo',i.solo],['Group',i.group]].map(([n,b])=>`<div class="price"><span>${n}</span><b>${money(priceAt(b,m))}${d?`<s>${money(b)}</s>`:''}</b><span>${d?d+'% loyalty discount':'No discount yet'}</span></div>`).join('');
    const x=v=>10+v*(340/18),y=v=>95-v*5;let p=`M${x(0)},${y(0)}`,pc=0;
    i.tiers.forEach(t=>{p+=` H${x(t.months)} V${y(t.percent)}`;pc=t.percent});p+=` H${x(18)}`;
    $('#st').innerHTML=`<path d="${p}" fill="none" stroke="#14213d" stroke-width="3"/><line x1="10" x2="350" y1="95" y2="95" stroke="#14213d"/><line x1="${x(m)}" x2="${x(m)}" y1="8" y2="95" stroke="#1f7a5c" stroke-dasharray="4"/><circle cx="${x(m)}" cy="${y(d)}" r="7" fill="#ffc93c" stroke="#14213d" stroke-width="2.5"/>${i.tiers.map(t=>`<text x="${x(t.months)}" y="108" font-size="10" text-anchor="middle" fill="#5b6b7a">${t.months}mo</text>`).join('')}`;
  };
  $('#mo').oninput=e=>{S.months=+e.target.value;draw()};draw();gradeDetail();
}
function gradeDetail(){
  const g=S.info.grades[S.grade-1];
  $('#gd').innerHTML=`<h3>Grade ${g.grade}: ${esc(g.title)}</h3><p class="demo" style="margin:6px 0 0">${esc(g.focus)}</p><div class="chips">${g.units.map(u=>`<span class="chip">${esc(u)}</span>`).join('')}</div>`;
}

/* ---------- auth ---------- */
const ID_RE=/^[A-Za-z0-9_-]{1,20}$/;
async function authDialog(role,mode){
  const reg=mode==='register';
  const fields=reg?`
    <div class="fld"><label for="a-name">Full name</label><input id="a-name" autocomplete="name" required><div class="hint"></div></div>
    <div class="fld"><label for="a-id">Choose an ID</label><input id="a-id" required autocapitalize="characters"><div class="hint">Letters, digits, - or _. You’ll use it to log in.</div></div>
    <div class="fld"><label for="a-ct">Contact number</label><input id="a-ct" inputmode="numeric" maxlength="11" required><div class="hint">11 digits.</div></div>
    ${role==='student'?`<div class="fld"><label for="a-gr">Grade</label><select id="a-gr">${S.info.grades.map(g=>`<option value="${g.grade}">Grade ${g.grade}</option>`).join('')}</select></div>`
    :`<div class="fld"><label>Sessions I offer</label><label><input type="checkbox" id="a-so" checked> Solo (${money(S.info.solo)})</label><label><input type="checkbox" id="a-gp" checked> Group (${money(S.info.group)})</label></div>`}`
    :`<div class="fld"><label for="a-id">Your ID</label><input id="a-id" required autocapitalize="characters"><div class="hint"></div></div>`;
  const ok=dialog(`<h2>${reg?'Create your account':'Welcome back'}</h2>
    <div class="seg" style="margin:12px 0"><button type="button" data-m="register" aria-pressed="${reg}">Sign up</button><button type="button" data-m="login" aria-pressed="${!reg}">Log in</button></div>
    ${reg?`<div class="seg" style="margin:0 0 12px 8px"><button type="button" data-r="student" aria-pressed="${role==='student'}">Student</button><button type="button" data-r="tutor" aria-pressed="${role==='tutor'}">Tutor</button></div>`:''}
    <form class="f" id="af" novalidate>${fields}<div class="acts"><button type="button" class="btn ghost" data-close="no">Cancel</button><button class="btn pri" id="a-ok">${reg?'Create account':'Log in'}</button></div></form>`,{onOpen:d=>{
      d.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{d.close('no');authDialog(role,b.dataset.m)});
      d.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{d.close('no');authDialog(b.dataset.r,'register')});
      const hint=(el,msg)=>{el.setAttribute('aria-invalid',!!msg);const h=el.closest('.fld').querySelector('.hint');if(msg){h.textContent=msg;h.classList.add('err')}};
      const rules={'a-id':v=>ID_RE.test(v)?'':'Use 1–20 letters, digits, - or _.','a-ct':v=>/^\d{11}$/.test(v)?'':'Enter exactly 11 digits.','a-name':v=>v.trim()?'':'Please enter your name.'};
      d.querySelectorAll('input').forEach(el=>el.onblur=()=>rules[el.id]&&hint(el,rules[el.id](el.value)));
      setTimeout(()=>d.querySelector('input').focus(),30);
      $('#af').onsubmit=async e=>{
        e.preventDefault();const g=i=>$('#'+i)?.value||'';
        for(const k in rules){const el=$('#'+k);if(el){const m=rules[k](el.value);if(m){hint(el,m);el.focus();return}}}
        const b=$('#a-ok');b.disabled=true;
        try{
          let me;
          if(reg){const body={role,id:g('a-id'),name:g('a-name'),contact:g('a-ct')};
            role==='student'?body.grade=g('a-gr'):(body.solo=$('#a-so').checked,body.group=$('#a-gp').checked);
            me=await api('register',body);toast(`Welcome, ${me.name.split(' ')[0]}. Your account is ready.`)}
          else me=await api('me?id='+encodeURIComponent(g('a-id')));
          d.close('done');signIn(me);
        }catch(err){fail(err);b.disabled=false}
      };
    }});
  await ok;
}
function signIn(me){S.me=me;S.tab=null;S.unit=null;sessionStorage.setItem('th',me.id);render()}
async function logout(){S.me=null;sessionStorage.removeItem('th');render()}

/* ---------- student ---------- */
async function studentView(){
  const m=S.me,tabs=[['book','Book a session'],['bookings','My bookings'],['profile','Profile']];
  S.tab=S.tab||'book';
  $('#main').innerHTML=`<section class="blk"><h2>Hi ${esc(m.name.split(' ')[0])}</h2>
  <p class="demo">Grade ${m.grade} · ${m.discount?m.discount+'% loyalty discount':'No loyalty discount yet'}</p>
  <div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button class="tab" role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${l}</button>`).join('')}</div><div id="pane"></div></section>`;
  ({book:bookPane,bookings:bookingsPane,profile:profilePane})[S.tab]();
}
async function bookPane(){
  const m=S.me,g=S.info.grades[m.grade-1];S.unit=S.unit||g.units[0];
  $('#pane').innerHTML=`<div class="row"><div class="seg" role="group" aria-label="Session type">
    <button data-type="SOLO" aria-pressed="${S.type==='SOLO'}">Solo ${money(m.solo)}</button><button data-type="GROUP" aria-pressed="${S.type==='GROUP'}">Group ${money(m.group)}</button></div>
    <span class="demo">${S.type==='GROUP'?`Runs once ${S.info.groupMin} students join. You’re charged only then.`:'Confirmed right away.'}</span></div>
    <h3 style="margin-top:22px">What do you want to work on?</h3>
    <div class="pills">${g.units.map(u=>`<button class="pill" data-unit="${esc(u)}" aria-pressed="${u===S.unit}">${esc(u)}</button>`).join('')}</div>
    <h3>Available times</h3><div class="grid" id="sl">${'<div class="skel"></div>'.repeat(3)}</div>`;
  try{
    const sl=await api(`slots?type=${S.type}&grade=${m.grade}&studentId=${m.id}`);
    $('#sl').innerHTML=sl.length?sl.map(slotCard).join(''):`<div class="empty" style="grid-column:1/-1">No ${S.type.toLowerCase()} times are open for Grade ${m.grade} yet.<br>Check back soon, or try the other session type.</div>`;
  }catch(e){fail(e)}
}
function slotCard(s){
  const grp=s.type==='GROUP',i=S.info,base=S.type==='SOLO'?i.solo:i.group;
  const dots=grp?`<div class="dots" aria-hidden="true">${Array.from({length:i.groupMax},(_,k)=>`<i class="${k<s.count?'f':k<i.groupMin?'n':''}"></i>`).join('')}</div>
    <span class="meta">${s.count<i.groupMin?`${i.groupMin-s.count} more needed to run`:`Running · ${i.groupMax-s.count} seat${i.groupMax-s.count===1?'':'s'} left`}</span>`:'';
  return `<div class="card"><h3>${s.day} ${s.start}–${s.end}</h3><span class="meta">with ${esc(s.tutor)}</span>${dots}
    <div class="go"><span><b>${money(s.price)}</b>${s.price<base?` <s class="meta">${money(base)}</s>`:''}</span><button class="btn pri sm" data-book="${s.id}">Book</button></div></div>`;
}
async function bookIt(id){
  const m=S.me;
  const card=$(`[data-book="${id}"]`).closest('.card'),title=$('h3',card).textContent;
  const grp=S.type==='GROUP';
  if(!await confirmBox('Confirm booking',`<b>${esc(S.unit)}</b><br>${esc(title)} · ${S.type==='SOLO'?'Solo':'Group'}<br>${grp?`You’re joining as a pending member. You’ll be charged only once ${S.info.groupMin} students have joined.`:'Confirmed right away.'}`,'Book it'))return;
  try{
    const b=await api('book',{studentId:m.id,slotId:id,grade:m.grade,unit:S.unit});
    toast(b.status==='CONFIRMED'?`Booked. ${money(b.price)} for ${b.slot?b.slot.day:''}.`:'You’re in the queue. We’ll confirm when the class fills.');
    S.tab='bookings';studentView();
  }catch(e){fail(e);bookPane()}
}
async function bookingsPane(){
  $('#pane').innerHTML='<div class="skel"></div>';
  try{
    const all=await api('bookings?id='+S.me.id),act=all.filter(b=>b.status!=='CANCELLED'),old=all.filter(b=>b.status==='CANCELLED');
    const c=b=>{const s=b.slot?b.slot:null;return `<div class="card"><div class="row" style="justify-content:space-between"><h3>${s?`${s.day} ${s.start}–${s.end}`:'Slot removed'}</h3><span class="badge ${b.status}">${b.status==='PENDING'?'Waiting for class':b.status[0]+b.status.slice(1).toLowerCase()}</span></div>
      <span>${esc(b.unit)}</span><span class="meta">${b.type==='SOLO'?'Solo':'Group'}${s?' · '+esc(s.tutor):''} · ${money(b.price)}${b.discount?` (${b.discount}% off)`:''}</span>
      ${s&&b.type==='GROUP'&&b.status==='PENDING'?`<div class="bar" title="${s.count} of ${S.info.groupMin}"><i style="width:${s.count/S.info.groupMin*100}%"></i></div><span class="meta">${s.count} of ${S.info.groupMin} students joined</span>`:''}
      ${b.status!=='CANCELLED'?`<div class="go"><span></span><button class="btn danger sm" data-cancel="${b.id}">Cancel</button></div>`:''}</div>`};
    $('#pane').innerHTML=act.length?`<div class="grid">${act.map(c).join('')}</div>`:`<div class="empty">You have no upcoming sessions.<br><button class="btn pri" style="margin-top:12px" data-tab="book">Find a time</button></div>`;
    if(old.length)$('#pane').innerHTML+=`<details style="margin-top:20px"><summary>Cancelled (${old.length})</summary><div class="grid">${old.map(c).join('')}</div></details>`;
  }catch(e){fail(e)}
}
function profilePane(){
  const m=S.me,tier=m.nextMonths;
  $('#pane').innerHTML=`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
    <div class="panel"><h3>Loyalty discount</h3><p style="font:800 2.6rem 'Bricolage Grotesque';margin:8px 0">${m.discount}%</p>
      <div class="bar"><i style="width:${tier?Math.min(100,m.months/tier*100):100}%"></i></div>
      <p class="meta">${tier?`${tier-m.months} more month${tier-m.months===1?'':'s'} to reach ${m.nextDiscount}% off.`:'You’re at the top tier.'} Account age: ${m.months} month${m.months===1?'':'s'}.</p>
      <details><summary>Demo: change my start date</summary><div class="row" style="margin-top:8px"><input type="date" id="rd" value="${m.registered}" max="${new Date().toISOString().slice(0,10)}"><button class="btn sm" data-act="setdate">Apply</button></div></details></div>
    <div class="panel"><h3>My details</h3><form class="f" id="pf" style="margin-top:10px">
      <div class="fld"><label for="p-n">Name</label><input id="p-n" value="${esc(m.name)}"></div>
      <div class="fld"><label for="p-c">Contact number</label><input id="p-c" value="${esc(m.contact)}" maxlength="11" inputmode="numeric"></div>
      <div class="fld"><label for="p-g">Grade</label><select id="p-g">${S.info.grades.map(g=>`<option value="${g.grade}" ${g.grade===m.grade?'selected':''}>Grade ${g.grade}</option>`).join('')}</select></div>
      <div class="acts"><button class="btn danger" type="button" data-act="del">Delete account</button><button class="btn pri">Save changes</button></div></form></div></div>`;
  $('#pf').onsubmit=e=>{e.preventDefault();saveProfile({name:$('#p-n').value,contact:$('#p-c').value,grade:$('#p-g').value})};
}
async function saveProfile(b){
  try{S.me=await api('update',{id:S.me.id,...b});S.unit=null;toast('Saved.');render()}catch(e){fail(e)}
}

/* ---------- tutor ---------- */
async function tutorView(){
  const m=S.me;S.tab=S.tab||'sched';
  $('#main').innerHTML=`<section class="blk"><h2>Hi ${esc(m.name.split(' ')[0])}</h2><p class="demo">Offering ${[m.solo&&'Solo',m.group&&'Group'].filter(Boolean).join(' and ')}</p>
  <div class="tabs" role="tablist">${[['sched','My week'],['profile','Profile']].map(([k,l])=>`<button class="tab" role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${l}</button>`).join('')}</div><div id="pane"></div></section>`;
  S.tab==='sched'?schedPane():tutorProfile();
}
async function schedPane(){
  $('#pane').innerHTML='<div class="skel"></div>';
  try{
    const sl=await api('tutor/slots?id='+S.me.id);S.slots=sl;
    $('#pane').innerHTML=(sl.length?'':`<p class="empty" style="margin-bottom:14px">Your week is empty. Add your first time below and students can start booking.</p>`)+
    `<div class="week">${DAYS.map((d,i)=>`<div class="day"><h3>${d}</h3>${sl.filter(s=>s.dayNum===i+1).map(s=>`<button class="slot ${s.type[0]}" data-slot="${s.id}"><b>${s.start}–${s.end}</b><br>${s.type==='SOLO'?'Solo':'Group'} · ${esc(s.status)}</button>`).join('')}<button class="add" data-add="${d}" aria-label="Add a time on ${d}">+ Add</button></div>`).join('')}</div>`;
  }catch(e){fail(e)}
}
async function addSlot(day){
  const m=S.me;
  await dialog(`<h2>Add a time</h2><form class="f" id="sf" style="margin-top:12px">
    <div class="fld"><label>Day</label><div class="pills" style="margin:0">${DAYS.map(d=>`<button type="button" class="pill" data-d="${d}" aria-pressed="${d===day}">${d}</button>`).join('')}</div></div>
    <div class="row"><div class="fld" style="flex:1"><label for="s1">Start</label><input type="time" id="s1" value="16:00" required></div><div class="fld" style="flex:1"><label for="s2">End</label><input type="time" id="s2" value="17:00" required></div></div>
    <div class="fld"><label>Session type</label><div class="seg">${m.solo?`<button type="button" data-t="SOLO" aria-pressed="${m.solo}">Solo</button>`:''}${m.group?`<button type="button" data-t="GROUP" aria-pressed="${!m.solo}">Group</button>`:''}</div></div>
    <div class="acts"><button type="button" class="btn ghost" data-close="no">Cancel</button><button class="btn pri">Add time</button></div></form>`,{onOpen:d=>{
      let dd=day,tt=m.solo?'SOLO':'GROUP';
      d.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{dd=b.dataset.d;d.querySelectorAll('[data-d]').forEach(x=>x.setAttribute('aria-pressed',x===b))});
      d.querySelectorAll('[data-t]').forEach(b=>{b.setAttribute('aria-pressed',b.dataset.t===tt);b.onclick=()=>{tt=b.dataset.t;d.querySelectorAll('[data-t]').forEach(x=>x.setAttribute('aria-pressed',x===b))}});
      $('#sf').onsubmit=async e=>{e.preventDefault();
        try{await api('tutor/slots/add',{id:m.id,day:dd,start:$('#s1').value,end:$('#s2').value,type:tt});d.close('ok');toast('Time added.');schedPane()}catch(err){fail(err)}};
    }});
}
async function slotDetail(id){
  const s=S.slots.find(x=>x.id===id),bs=JSON.parse(JSON.stringify(s.bookings));
  const go=await dialog(`<h2>${s.day} ${s.start}–${s.end}</h2><p class="meta">${s.type==='SOLO'?'Solo':'Group'} · ${esc(s.status)}</p>
    ${bs.length?`<ul>${bs.map(b=>`<li><b>${esc(b.student)}</b>, Grade ${b.grade}: ${esc(b.unit)}</li>`).join('')}</ul>`:'<p class="empty">No students yet.</p>'}
    <div class="acts"><button class="btn ghost" data-close="no">Close</button><button class="btn danger" data-close="ok">Remove time</button></div>`);
  if(go&&await confirmBox('Remove this time?',bs.length?`This cancels the booking${bs.length>1?'s':''} of ${bs.length} student${bs.length>1?'s':''}.`:'No students are booked, so nobody is affected.','Remove',true))
    try{const r=await api('tutor/slots/remove',{id:S.me.id,slotId:id});toast(r.cancelled?`Removed. ${r.cancelled} booking(s) cancelled.`:'Removed.');schedPane()}catch(e){fail(e)}
}
function tutorProfile(){
  const m=S.me;
  $('#pane').innerHTML=`<div class="panel" style="max-width:520px"><form class="f" id="pf">
    <div class="fld"><label for="p-n">Name</label><input id="p-n" value="${esc(m.name)}"></div>
    <div class="fld"><label for="p-c">Contact number</label><input id="p-c" value="${esc(m.contact)}" maxlength="11"></div>
    <div class="fld"><label>Sessions I offer</label><label><input type="checkbox" id="p-s" ${m.solo?'checked':''}> Solo</label><label><input type="checkbox" id="p-gp" ${m.group?'checked':''}> Group</label><div class="hint">To switch a type off, remove its times first.</div></div>
    <div class="acts"><button class="btn danger" type="button" data-act="del">Delete account</button><button class="btn pri">Save changes</button></div></form></div>`;
  $('#pf').onsubmit=e=>{e.preventDefault();saveProfile({name:$('#p-n').value,contact:$('#p-c').value,solo:$('#p-s').checked,group:$('#p-gp').checked})};
}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const t=e.target.closest('button');if(!t)return;
  const d=t.dataset;
  if(d.act==='home'){S.tab=null;render()}
  else if(d.act==='learn'){S.me?0:$('#learn')?.scrollIntoView()}
  else if(d.act==='auth')authDialog(d.role||'student',d.mode);
  else if(d.act==='demo'){try{signIn(await api('me?id='+d.id))}catch(x){fail(x)}}
  else if(d.act==='logout')logout();
  else if(d.act==='setdate'){try{S.me=await api('demo/date',{id:S.me.id,date:$('#rd').value});toast('Start date changed.');render()}catch(x){fail(x)}}
  else if(d.act==='del'){if(await confirmBox('Delete your account?','Your bookings or times will be cancelled. This can’t be undone.','Delete account',true))try{await api('delete',{id:S.me.id});toast('Account deleted.');logout()}catch(x){fail(x)}}
  else if(d.g){S.grade=+d.g;$('#gp').querySelectorAll('.pill').forEach(p=>p.setAttribute('aria-pressed',p===t));gradeDetail()}
  else if(d.tab){S.tab=d.tab;S.me.role==='student'?studentView():tutorView()}
  else if(d.type){S.type=d.type;bookPane()}
  else if(d.unit){S.unit=d.unit;document.querySelectorAll('[data-unit]').forEach(p=>p.setAttribute('aria-pressed',p===t))}
  else if(d.book)bookIt(d.book);
  else if(d.cancel){const c=await confirmBox('Cancel this booking?','If this is a group class, it may drop back to pending when you leave.','Cancel booking',true);if(c)try{await api('cancel',{id:S.me.id,bookingId:d.cancel});toast('Booking cancelled.');bookingsPane()}catch(x){fail(x)}}
  else if(d.add)addSlot(d.add);
  else if(d.slot)slotDetail(d.slot);
});
(async()=>{
  try{S.info=await api('info');const id=sessionStorage.getItem('th');if(id)try{S.me=await api('me?id='+id)}catch(e){}}
  catch(e){$('#main').innerHTML=`<div class="empty" style="margin-top:40px">Can’t reach the Theorem House server.<br>Start it with <code>./run.sh</code> and open <b>http://localhost:8080</b>.</div>`;return}
  render();
})();
</script>
</body>
</html>
